# html2epub config for "Building Sensory AI: Machine Perception of the Physical World"
# Run: python -m html2epub build .
[book]
title = "Building Sensory AI"
subtitle = "Machine Perception of the Physical World"
edition = "First Edition"
language = "en"
publisher = "Apartsin"
rights = "Copyright (c) 2026 Alexander Apartsin and Yehudit Aperstein. All rights reserved."
publication_date = "2026-06-14"
description = """A comprehensive, self-contained textbook and field manual on AI systems that \
perceive the physical world through the full spectrum of sensing: inertial, vibration, radar, \
lidar, depth, thermal, event, RF/Wi-Fi, tactile, biosignals, and industrial telemetry. Fourteen \
parts across measure, clean, represent, infer, fuse, and deploy. Every core idea is built from \
scratch and then shown with the modern library that makes it a few lines of code. Covers signal \
processing and state estimation, deep learning and foundation models for sensor time series, \
agentic sensing, multimodal fusion and world models, edge and TinyML deployment, and trust, \
safety, and evaluation, with hands-on labs and exercises."""
keywords = [
  "sensor AI time series foundation models",
  "IMU wearable human activity recognition",
  "radar lidar depth event neuromorphic sensing",
  "sensor fusion Kalman filter SLAM world models",
  "edge AI TinyML federated on-device learning",
  "biosignals ECG PPG EEG EMG wearable health AI",
]

[[book.authors]]
name = "Alexander Apartsin"
file_as = "Apartsin, Alexander"
role = "aut"

[[book.authors]]
name = "Yehudit Aperstein"
file_as = "Aperstein, Yehudit"
role = "aut"

[content]
source_dir = "."
spine = "auto"
front_matter_dir = "front-matter"
parts_glob = "part-*"
module_glob = "module-*"
appendices_dir = "appendices"
capstone_dir = "capstone"
section_glob = "section-*.html"
fm_order = [
  "foreword.html",
  "fm-what-this-book-covers.html",
  "fm-who-should-read.html",
  "fm-how-to-use.html",
  "about-authors.html",
  "copyright.html",
]

[styling]
stylesheets = ["styles/book.css", "styles/pygments.css"]

[math]
render = "katex"
node_exe = "node"
katex_path = "KDP/build/node_modules"

[images]
max_side = 1100
jpeg_quality = 80
compress_pngs = true

[transforms]
wide_table_min_cols = 6
slim_index_lists = true
drop_inline_style_over = 1500
